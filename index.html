<style>

header{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}

.dot.live{background:var(--lead);animation:pulse 2s infinite}

/* Grid de painéis */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.painel{background:var(--panel);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.painel-head{padding:16px 18px 14px;border-left:8px solid var(--urna)}

.track .fill{height:100%;background:var(--urna);transition:width .8s ease}

.cands{display:grid;gap:1px;background:var(--line);border-top:1px solid var(--line)}

.cand .nome{font-weight:700}
.cand .partido{color:var(--muted);font-weight:500;font-size:.85rem;margin-left:6px}
.cand .num{text-align:right;font-weight:850;font-size:1.3rem;font-variation-settings:"wdth" 70;font-variant-numeric:tabular-nums;grid-row:span 2}

.outros{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}

.msg{padding:10px 16px;border-top:1px solid var(--line);border-left:5px solid var(--err);font-size:.85rem;display:none}

.rodape{margin-top:24px;font-size:.82rem;color:var(--muted)}

<script>
/* Disputas acompanhadas. Em 2026 o TSE separa a eleição federal (6257, Presidente)
   da estadual (6259, Senador e Deputados). Em 2026 o Senado renova 2/3: duas vagas por estado. */
const CORRIDAS = [
  {id:"pres", titulo:"Presidente",         escopo:"Brasil",            eleicao:"6257", uf:"br", cargo:"0001", vagas:1,  eleitorado:156e6},
  {id:"sen",  titulo:"Senador",            escopo:"Paraná · 2 vagas",  eleicao:"6259", uf:"pr", cargo:"0005", vagas:2,  eleitorado:8.6e6},
  {id:"depf", titulo:"Deputado federal",   escopo:"Paraná · 30 vagas", eleicao:"6259", uf:"pr", cargo:"0006", vagas:30, eleitorado:8.6e6},
  {id:"depe", titulo:"Deputado estadual",  escopo:"Paraná · 54 vagas", eleicao:"6259", uf:"pr", cargo:"0007", vagas:54, eleitorado:8.6e6}
];
const MOSTRAR = 2; // só 1º e 2º lugar em cada card
const INTERVALO_SEG = 30;
const $ = id => document.getElementById(id);

const fmtInt = n => Number(n || 0).toLocaleString("pt-BR");
const toNum = s => typeof s === "number" ? s : parseFloat(String(s || "0").replace(/\./g,"").replace(",", ".")) || 0;
const fmtPct = n => n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});

/* ---------- Monta os painéis ---------- */
CORRIDAS.forEach(c => {
  const el = document.createElement("section");
  el.className = "painel";
  el.setAttribute("aria-label", `${c.titulo}, ${c.escopo}`);
  el.innerHTML = `
    <div class="painel-head" aria-live="polite">
      <h2>${c.titulo}<small>${c.escopo}</small></h2>
      <div class="pct" data-k="pct">0,00<small>% das seções apuradas</small></div>
      <div class="track"><div class="fill" data-k="pctBar" style="width:0%"></div></div>
      <div class="meta" data-k="atualizado">Sem dados ainda</div>
    </div>
    <div class="msg" data-k="msg" role="alert"></div>
    <div class="cands" data-k="cands"><div class="vazio">Aguardando dados.</div></div>
    <div class="outros" data-k="outros"></div>`;
  c.el = k => el.querySelector(`[data-k="${k}"]`);
  $("grid").appendChild(el);
});

/* O TSE não envia cabeçalho CORS: aberto via servidor.py, as requisições passam pelo proxy local /tse/. */
const BASE_TSE = location.protocol.startsWith("http") ? "/tse" : "https://resultados.tse.jus.br";
function buildUrl(c){
  return `${BASE_TSE}/oficial/ele2026/${c.eleicao}/dados/${c.uf}/${c.uf}-c${c.cargo}-e${c.eleicao.padStart(6,"0")}-u.json`;
}

/* ---------- Normaliza o arquivo unificado do TSE (-u.json, formato de 2026) ---------- */
function normalize(d){
  const cands = [];
  (d.carg || []).forEach(cg => (cg.agr || []).forEach(ag => (ag.par || []).forEach(pa => (pa.cand || []).forEach(c => cands.push({
    nome: c.nmu || c.nm || "Sem nome",
    partido: pa.sg || "",
    numero: c.n || "",
    votos: toNum(c.vap),
    pct: toNum(c.pvap),
    eleito: (c.e === "s" || /^eleit/i.test(c.st || "")),
    segundo: /2º turno/i.test(c.st || "")
  })))));
  const s = d.s || {}, v = d.v || {}, e = d.e || {};
  return {
    pst: toNum(s.pst),
    cands,
    brancos: {v: toNum(v.vb), p: toNum(v.pvb)},
    nulos: {v: toNum(v.tvn), p: toNum(v.ptvn)},
    abst: {v: toNum(e.a), p: toNum(e.pa)},
    hora: d.hg ? `${d.dg || ""} ${d.hg}`.trim() : null
  };
}

/* ---------- Modo demonstração: dados fictícios que avançam ---------- */
const PARTIDOS = ["Partido Azul","Partido Verde","Partido Laranja","Partido Cinza","Partido Roxo","Partido Vinho"];
const DEMO_FIXO = {
  pres: [
    {nome:"Helena Duarte", partido:"Partido Azul", w:.41},
    {nome:"Ricardo Montes", partido:"Partido Verde", w:.37},
    {nome:"Lúcia Aranha", partido:"Partido Laranja", w:.11},
    {nome:"Paulo Brites", partido:"Partido Cinza", w:.07},
    {nome:"Outros candidatos", partido:"", w:.04}
  ],
  sen: [
    {nome:"Marta Kowalski", partido:"Partido Verde", w:.27},
    {nome:"Jorge Tavares", partido:"Partido Azul", w:.24},
    {nome:"Celso Ribas", partido:"Partido Laranja", w:.19},
    {nome:"Ana Paula Zanin", partido:"Partido Roxo", w:.16},
    {nome:"Edson Müller", partido:"Partido Cinza", w:.09},
    {nome:"Outros candidatos", partido:"", w:.05}
  ]
};
/* Deputados: lista fictícia longa, com votos concentrados nos primeiros */
function demoDeputados(n, salto){
  const pre = ["Ana","Bruno","Carla","Diego","Elisa","Fábio","Gisele","Hugo","Irene","João","Karina","Leandro","Marina","Nelson","Olga","Pedro","Rita","Sérgio","Tânia","Vítor"];
  const sob = ["Andrade","Bortolini","Cavalcanti","Dallagnol","Esposito","Ferraz","Gomes","Hoffmann","Iwamoto","Jardim","Krüger","Lopes","Moraes","Nogueira","Oliveira","Pacheco","Quadros","Rocha","Silveira","Teixeira","Urbano","Vieira","Wolff","Zanetti"];
  return Array.from({length:n}, (_,i) => ({
    nome: `${pre[(i + salto) % pre.length]} ${sob[(i*7 + salto) % sob.length]}`,
    partido: PARTIDOS[(i*5) % PARTIDOS.length],
    w: 1/Math.pow(i+4, 1.1) * (.8 + Math.random()*.4)
  }));
}
function prepararDemo(c){
  c.demoProg = 0;
  c.demoBase = DEMO_FIXO[c.id] || demoDeputados(c.vagas*4, c.id === "depe" ? 3 : 0);
}
function demoData(c){
  c.demoProg = Math.min(100, c.demoProg + 3 + Math.random()*9);
  const comp = c.eleitorado * .79 * c.demoProg/100;
  const validos = comp * .94;
  const ws = c.demoBase.map(d => d.w * (1 + (Math.random()-.5)*.06));
  const sum = ws.reduce((a,b)=>a+b,0);
  const cands = c.demoBase.map((d,i) => {
    const pct = ws[i]/sum*100;
    return {nome:d.nome, partido:d.partido, votos:Math.round(validos*pct/100), pct, eleito:false, segundo:false};
  });
  if (c.demoProg >= 100){
    cands.sort((a,b)=>b.pct-a.pct);
    const reais = cands.filter(x => x.partido);
    if (c.cargo === "0001"){ if (reais[0].pct > 50) reais[0].eleito = true; else reais[0].segundo = reais[1].segundo = true; }
    else reais.slice(0, c.vagas).forEach(x => x.eleito = true);
  }
  return {pst:c.demoProg, cands, brancos:{v:comp*.025,p:2.5}, nulos:{v:comp*.035,p:3.5}, abst:{v:c.eleitorado*.21*c.demoProg/100,p:21}, hora:new Date().toLocaleTimeString("pt-BR")};
}

/* ---------- Render ---------- */
function render(c, r){
  c.el("pct").firstChild.nodeValue = fmtPct(r.pst);
  c.el("pctBar").style.width = r.pst + "%";
  c.el("atualizado").textContent = r.hora ? `Atualizado às ${r.hora}` : "Atualizado agora";
  const list = [...r.cands].sort((a,b)=>b.votos-a.votos).slice(0, MOSTRAR);
  const max = Math.max(...list.map(x=>x.pct), 1);
  const box = c.el("cands");
  box.innerHTML = "";
  list.forEach((x,i) => {
    const el = document.createElement("div");
    el.className = "cand" + (i===0 ? " lead" : "");
    const tag = x.eleito ? '<span class="tag">Eleito</span>' : x.segundo ? '<span class="tag">2º turno</span>' : "";
    el.innerHTML = `<span class="pos">${i+1}º</span>
      <span><span class="nome"></span><span class="partido"></span>${tag}</span>
      <span class="num">${fmtPct(x.pct)}%<span class="votos">${fmtInt(x.votos)} votos</span></span>
      <div class="bar"><div class="fill" style="width:${x.pct/max*100}%"></div></div>`;
    el.querySelector(".nome").textContent = x.nome;
    el.querySelector(".partido").textContent = x.partido;
    box.appendChild(el);
  });
  c.el("outros").innerHTML = [["Brancos",r.brancos],["Nulos",r.nulos],["Abstenções",r.abst]]
    .map(([n,o]) => `<div><b>${fmtPct(o.p)}%</b><span>${n}: ${fmtInt(Math.round(o.v))}</span></div>`).join("");
}
function showMsg(c, t){ const m = c.el("msg"); m.textContent = t || ""; m.style.display = t ? "block" : "none"; }
function setStatus(kind, txt){ $("dot").className = "dot " + kind; $("statusTxt").textContent = txt; }

/* ---------- Contador de atualizações ---------- */
let intervaloSeg = 30, proximaEm = null, totalAtual = 0, historico = [], relogio = null;
const CIRC = 94.25;
function registrarAtualizacao(){
  totalAtual++;
  const agora = Date.now();
  historico.push(agora);
  historico = historico.filter(t => agora - t <= 60000);
  $("total").textContent = fmtInt(totalAtual);
  $("ritmo").textContent = historico.length;
}
function atualizarRelogio(){
  if (!timer || !proximaEm){ $("proxima").textContent = "—"; $("ringFg").style.strokeDashoffset = CIRC; return; }
  const rest = Math.max(0, Math.ceil((proximaEm - Date.now())/1000));
  const m = Math.floor(rest/60), s = rest % 60;
  $("proxima").textContent = m ? `${m}min ${String(s).padStart(2,"0")}s` : `${s}s`;
  $("ringFg").style.strokeDashoffset = CIRC * (rest / intervaloSeg);
  const agora = Date.now();
  historico = historico.filter(t => agora - t <= 60000);
  $("ritmo").textContent = historico.length;
}

/* ---------- Loop ---------- */
let timer = null;
async function carregar(c){
  try{
    const res = await fetch(buildUrl(c) + "?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error(res.status === 404 ? "O TSE ainda não publicou este arquivo (404)." : `O TSE respondeu com erro ${res.status}.`);
    render(c, normalize(await res.json()));
    showMsg(c, "");
    return true;
  }catch(e){
    showMsg(c, e.message.includes("Failed to fetch") || e.name === "TypeError"
      ? "O navegador não conseguiu ler o arquivo do TSE. Rode “python3 servidor.py” e abra http://localhost:8000."
      : e.message);
    return false;
  }
}
async function tick(){
  proximaEm = Date.now() + intervaloSeg*1000;
  registrarAtualizacao();
  if ($("modo").value === "demo"){
    CORRIDAS.forEach(c => { if (c.demoProg < 100) render(c, demoData(c)); showMsg(c, ""); });
    setStatus("live","Demonstração");
    if (CORRIDAS.every(c => c.demoProg >= 100)) stop("Apuração concluída (demo)");
    return;
  }
  const oks = await Promise.all(CORRIDAS.map(carregar));
  oks.every(Boolean) ? setStatus("live","Ao vivo")
    : oks.some(Boolean) ? setStatus("err","Falha em parte dos painéis")
    : setStatus("err","Falha na leitura");
}
function start(){
  stop(); totalAtual = 0; historico = [];
  CORRIDAS.forEach(prepararDemo);
  intervaloSeg = $("modo").value === "demo" ? 2 : INTERVALO_SEG;
  timer = setInterval(tick, intervaloSeg*1000);
  relogio = setInterval(atualizarRelogio, 250);
  $("toggle").textContent = "Parar";
  tick();
}
function stop(txt, kind){
  if (timer){ clearInterval(timer); timer = null; }
  if (relogio){ clearInterval(relogio); relogio = null; }
  proximaEm = null; atualizarRelogio();
  $("toggle").textContent = "Iniciar";
  if (txt) setStatus(kind || "", txt);
}
$("toggle").addEventListener("click", () => timer ? stop("Parado") : start());
$("modo").addEventListener("change", () => { if (timer) start(); });
start();
</script>
</body>
